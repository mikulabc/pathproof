name: Feature request
description: Propose an improvement to Pathproof.
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workarounds or other designs you considered.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: This can be implemented without uploading private run data by default.
          required: true
        - label: I removed customer-specific information from this proposal.
          required: true
